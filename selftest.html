<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>selftest — win11-fluent-ui 校验器自测页</title>
<link rel="stylesheet" href="fluent2-tokens.css">
<link rel="stylesheet" href="fluent2-controls.css">
<link rel="stylesheet" href="fluent2-motion.css">
</head>
<body>
<header class="fl-titlebar">
  <span class="fl-body-strong">selftest</span>
  <span style="flex:1"></span>
  <button class="fl-btn fl-btn-subtle" id="btn-theme" type="button" aria-label="切换明暗主题">◐</button>
</header>

<div class="fl-shell">
  <nav class="fl-nav" id="nav" aria-label="导航">
    <a class="fl-nav-item" href="#" data-page="page-a" aria-current="page">页面 A</a>
    <a class="fl-nav-item" href="#" data-page="page-b">页面 B</a>
  </nav>

  <main class="fl-content-layer">
    <section class="fl-page fl-current" id="page-a">
      <div class="fl-infobar" id="infobar" data-severity="success" role="status">
        <span class="fl-body">InfoBar success。</span>
        <span style="flex:1"></span>
        <button class="fl-btn fl-btn-subtle" id="btn-infobar-close" type="button" aria-label="关闭">✕</button>
      </div>

      <div class="fl-toolbar" id="toolbar">
        <button class="fl-btn fl-btn-accent" id="btn-primary" type="button">主命令</button>
        <button class="fl-btn" id="btn-normal" type="button">次命令</button>
        <button class="fl-btn fl-btn-subtle" id="btn-more" type="button" aria-haspopup="true">⋯</button>
        <input class="fl-input" id="search" type="search" placeholder="搜索…">
      </div>

      <div id="list" role="listbox" aria-label="列表">
        <div class="fl-listitem fl-entrance" role="option" aria-selected="true" tabindex="0">列表项一</div>
        <div class="fl-listitem fl-entrance" role="option" aria-selected="false" tabindex="0">列表项二</div>
        <div class="fl-listitem fl-entrance" role="option" aria-selected="false" tabindex="0" aria-disabled="true">禁用项</div>
      </div>

      <div class="fl-card fl-hoverable fl-entrance" tabindex="0" id="card">
        <span class="fl-body-strong">卡片</span>
        <p class="fl-caption">elevation 8，hover 提亮。</p>
      </div>

      <div class="fl-card" id="controls-card">
        <label class="fl-switch"><input type="checkbox" id="sw-a" checked><span class="fl-switch-track"></span><span class="fl-body">Switch</span></label>
        <label class="fl-check"><input type="checkbox" id="cb-a" checked><span class="fl-box"></span><span class="fl-body">CheckBox</span></label>
        <label class="fl-radio"><input type="radio" name="r" id="rd-a" checked><span class="fl-box"></span><span class="fl-body">Radio</span></label>
        <select class="fl-select" id="sel"><option>ComboBox</option></select>
      </div>
    </section>

    <section class="fl-page" id="page-b">
      <h2 class="fl-subtitle">页面 B</h2>
      <div class="fl-card fl-strong-entrance" id="strong-card">
        <span class="fl-body-strong">Strong Entrance 演示</span>
      </div>
    </section>
  </main>
</div>

<div class="fl-flyout fl-overlay" id="flyout-more" role="menu" style="position:fixed; top:64px; right:16px;">
  <button class="fl-flyout-item" type="button" role="menuitem">动作一</button>
  <button class="fl-flyout-item" type="button" role="menuitem">动作二</button>
</div>

<div class="fl-dialog fl-overlay" id="dialog-test" role="dialog" aria-modal="true" aria-labelledby="dialog-test-title">
  <h2 class="fl-subtitle fl-dialog-title" id="dialog-test-title">对话框</h2>
  <p class="fl-body">ContentDialog（Smoke 遮罩 + elevation 128）。</p>
  <div class="fl-dialog-actions">
    <button class="fl-btn" id="btn-dialog-cancel" type="button">取消</button>
    <button class="fl-btn fl-btn-accent" id="btn-dialog-ok" type="button">确定</button>
  </div>
</div>

<script src="fluent2-motion.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  if ($("btn-theme")) $("btn-theme").addEventListener("click", function () { M.toggleTheme(); });
  document.querySelectorAll(".fl-nav-item[data-page]").forEach(function (a) {
    a.addEventListener("click", function (e) {
      e.preventDefault();
      M.transitionTo(a.getAttribute("data-page"));
      document.querySelectorAll(".fl-nav-item").forEach(function (x) { x.removeAttribute("aria-current"); });
      a.setAttribute("aria-current", "page");
    });
  });
  if ($("btn-infobar-close")) $("btn-infobar-close").addEventListener("click", function () { $("infobar").remove(); });
  if ($("btn-more")) $("btn-more").addEventListener("click", function (e) { e.stopPropagation(); M.flyout.toggle("flyout-more"); });
  if ($("btn-primary")) $("btn-primary").addEventListener("click", function () { M.dialog.show("dialog-test"); });
  if ($("btn-dialog-ok")) $("btn-dialog-ok").addEventListener("click", function () { M.dialog.hide("dialog-test"); M.toast("已确认"); });
  if ($("btn-dialog-cancel")) $("btn-dialog-cancel").addEventListener("click", function () { M.dialog.hide("dialog-test"); });
  document.addEventListener("click", function (e) {
    if (!e.target.closest(".fl-flyout") && !e.target.closest("#btn-more")) M.flyout.hide("flyout-more");
  });
  M.stagger(document.querySelector(".fl-page.fl-current") || document.body);
})();
</script>
</body>
</html>
